name: n3o release assets
description: >-
  Keeps build artefacts on the GitHub release of a tag, beside a SHA256SUMS that names each one.
  attach creates the release when it is missing and adds the files, accepting a file already there
  only when its checksum is the same; download fetches files and verifies them against SHA256SUMS.

inputs:
  tag:
    description: The tag whose release holds the files. It must already exist on the remote.
    required: true
  mode:
    description: attach or download.
    required: true
  files:
    description: Newline-separated paths. attach uploads them, under their base names; download fetches them by base name, or every listed file when empty.
    required: false
    default: ''
  directory:
    description: Where download writes the files.
    required: false
    default: ''
  if-missing:
    description: What download does when the release or a file is missing; fail or skip.
    required: false
    default: fail
  title:
    description: The release's title when attach creates it; the tag when empty.
    required: false
    default: ''
  notes:
    description: The release's notes when attach creates it.
    required: false
    default: ''
  token:
    description: Reads and writes the release; attach needs contents write.
    required: false
    default: ${{ github.token }}

outputs:
  found:
    description: "'true' when download fetched and verified every file."
    value: ${{ steps.download.outputs.found }}
  url:
    description: The release's page.
    value: ${{ steps.attach.outputs.url || steps.download.outputs.url }}

runs:
  using: "composite"
  steps:
    - id: attach
      if: inputs.mode == 'attach'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        FILES: ${{ inputs.files }}
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        mapfile -t files < <(grep -v '^[[:space:]]*$' <<< "$FILES")

        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::attach names no files"
          exit 1
        fi

        work=$(mktemp -d)
        sums="$work/SHA256SUMS"
        : > "$sums"

        for file in "${files[@]}"; do
          name=$(basename "$file")

          if grep -q "  $name\$" "$sums"; then
            echo "::error::two files are named $name"
            exit 1
          fi

          (cd "$(dirname "$file")" && sha256sum "$name") >> "$sums"
        done

        upload=("${files[@]}")

        if gh release view "$TAG" > /dev/null 2>&1; then
          if gh release download "$TAG" --pattern SHA256SUMS --dir "$work/existing" 2> /dev/null; then
            upload=()

            for file in "${files[@]}"; do
              name=$(basename "$file")
              have=$(awk -v n="$name" '$2 == n { print $1 }' "$work/existing/SHA256SUMS")
              want=$(awk -v n="$name" '$2 == n { print $1 }' "$sums")

              if [ -z "$have" ]; then
                upload+=("$file")
              elif [ "$have" != "$want" ]; then
                echo "::error::$TAG already holds a different $name"
                exit 1
              fi
            done

            awk 'NR == FNR { seen[$2] = 1; print; next } !($2 in seen)' "$sums" "$work/existing/SHA256SUMS" | sort -k2 > "$work/merged"
            mv "$work/merged" "$sums"
          fi

          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}" --clobber
          fi

          gh release upload "$TAG" "$sums" --clobber
        else
          gh release create "$TAG" "${files[@]}" "$sums" --verify-tag --latest=false \
            --title "${TITLE:-$TAG}" --notes "$NOTES"
        fi

        echo "url=$(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"

    - id: download
      if: inputs.mode == 'download'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        FILES: ${{ inputs.files }}
        DIRECTORY: ${{ inputs.directory }}
        IF_MISSING: ${{ inputs.if-missing }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        missing() {
          if [ "$IF_MISSING" = skip ]; then
            echo "::notice::$1"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::$1"
          exit 1
        }

        if [ -z "$DIRECTORY" ]; then
          echo "::error::download names no directory"
          exit 1
        fi

        if ! assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2> /dev/null); then
          missing "$TAG has no release"
        fi

        if ! grep -qx SHA256SUMS <<< "$assets"; then
          missing "$TAG's release has no SHA256SUMS"
        fi

        mkdir -p "$DIRECTORY"
        gh release download "$TAG" --pattern SHA256SUMS --dir "$DIRECTORY" --clobber

        mapfile -t names < <(grep -v '^[[:space:]]*$' <<< "$FILES" | xargs -r -n1 basename)

        if [ "${#names[@]}" -eq 0 ]; then
          mapfile -t names < <(awk '{ print $2 }' "$DIRECTORY/SHA256SUMS")
        fi

        for name in "${names[@]}"; do
          if ! grep -qx -- "$name" <<< "$assets" || ! awk -v n="$name" '$2 == n { found = 1 } END { exit !found }' "$DIRECTORY/SHA256SUMS"; then
            missing "$TAG's release has no verifiable $name"
          fi

          gh release download "$TAG" --pattern "$name" --dir "$DIRECTORY" --clobber
        done

        (cd "$DIRECTORY" && printf '%s\n' "${names[@]}" | awk 'NR == FNR { want[$1] = 1; next } $2 in want' - SHA256SUMS | sha256sum -c --strict --quiet)

        {
          echo "found=true"
          echo "url=$(gh release view "$TAG" --json url --jq .url)"
        } >> "$GITHUB_OUTPUT"
