name: n3o dotnet setup
description: Central .NET SDK setup — uses the baked-in SDK on self-hosted runners, installs via setup-dotnet on GitHub-hosted.

inputs:
  dotnet-version:
    description: .NET SDK version to install on GitHub-hosted runners (self-hosted uses the baked-in SDK)
    required: false
    default: '10.x'

runs:
  using: "composite"
  steps:
    - name: Use baked-in .NET SDK (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        if ! command -v dotnet >/dev/null 2>&1; then
          echo "::error::dotnet not found on PATH; expected the self-hosted runner image to bake in the .NET SDK." >&2
          exit 1
        fi

        # The exit status is the result. Interpolated into an echo it is discarded, and an SDK
        # that cannot resolve passes this step. Its output is dropped rather than logged: the
        # resolver quotes the repository back, and a line beginning :: is a runner command.
        if ! dotnet --version >/dev/null 2>&1; then
          echo "::error::The baked-in .NET SDK did not resolve. Run 'dotnet --version' on the runner to see why." >&2
          exit 1
        fi

    - name: Install .NET SDK (GitHub-hosted)
      if: runner.environment == 'github-hosted'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
