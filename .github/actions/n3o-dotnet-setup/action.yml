name: n3o dotnet setup
description: Central .NET SDK setup — uses the baked-in SDK on self-hosted runners, installs via setup-dotnet on GitHub-hosted.

inputs:
  dotnet-version:
    description: .NET SDK version to install on GitHub-hosted runners (self-hosted uses the baked-in SDK)
    required: false
    default: '10.x'

runs:
  using: "composite"
  steps:
    - name: Use baked-in .NET SDK (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        if out=$(dotnet --version 2>&1); then
          echo "Using baked-in .NET SDK $out"
        else
          # Breaking the :: token is what stops the resolver's output being read as a runner
          # command. Indenting it does not: the runner trims the line before matching.
          printf '%s\n' "$out" | sed -e 's/::/: :/g' -e 's/##\[/## [/g' >&2
          echo "::error::No usable .NET SDK on this runner — rebuild n3o-toolchain in n3oltd/devops so the fleet carries one that satisfies global.json." >&2
          exit 1
        fi

    - name: Install .NET SDK (GitHub-hosted)
      if: runner.environment == 'github-hosted'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
