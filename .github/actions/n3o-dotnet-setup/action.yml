name: n3o dotnet setup
description: Central .NET SDK setup — uses the baked-in SDK on self-hosted runners, installs via setup-dotnet on GitHub-hosted.

inputs:
  dotnet-version:
    description: .NET SDK version to install on GitHub-hosted runners (self-hosted uses the baked-in SDK)
    required: false
    default: '10.x'

runs:
  using: "composite"
  steps:
    - name: Use baked-in .NET SDK (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        if ! command -v dotnet >/dev/null 2>&1; then
          echo "::error::dotnet not found on PATH; expected the self-hosted runner image to bake in the .NET SDK." >&2
          exit 1
        fi

        # `dotnet --version` resolves global.json, so it is the check that the baked-in SDK is
        # usable here and not merely present. Its status has to be captured: interpolated into an
        # echo it is discarded, and the step passes while every later dotnet call exits 155.
        if ! resolved="$(dotnet --version 2>&1)"; then
          printf '%s\n' "$resolved" >&2
          echo "::error::The baked-in .NET SDK does not satisfy this repository's global.json (detail above). Rebuild n3o-toolchain in n3oltd/devops so the runner fleet carries the requested SDK." >&2
          exit 1
        fi

        echo "Using baked-in .NET SDK $resolved at $(command -v dotnet)"

    - name: Install .NET SDK (GitHub-hosted)
      if: runner.environment == 'github-hosted'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
