name: n3o dotnet setup
description: Central .NET SDK setup — uses the baked-in SDK on self-hosted runners, installs via setup-dotnet on GitHub-hosted.

inputs:
  dotnet-version:
    description: .NET SDK version to install on GitHub-hosted runners (self-hosted uses the baked-in SDK)
    required: false
    default: '10.x'

runs:
  using: "composite"
  steps:
    - name: Use baked-in .NET SDK (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        rc=0
        errors=$(mktemp)
        trap 'rm -f "$errors"' EXIT
        sdks=$(dotnet --version 2>"$errors") || rc=$?

        if [ "$rc" -eq 0 ]; then
          out=$sdks
        else
          # The installed list is on stdout and the rest on stderr. Merged with 2>&1 the list
          # flushes below its own "Installed SDKs:" header, which reads as none installed.
          out=$(cat "$errors"; printf 'Installed SDKs: %s\n' "${sdks:-none}")
        fi

        # Repository-controlled and unbounded, and the substitutions below are quadratic in the
        # number of matches.
        out=${out:0:65536}
        # :: and ##[ are broken rather than indented; the runner trims before it matches.
        out=${out//::/: :}
        out=${out//'##['/'## ['}

        if [ "$rc" -eq 0 ]; then
          echo "Resolved .NET SDK $out at $(command -v dotnet)"
        else
          printf '%s\n' "${out:-dotnet exited $rc with no output}" >&2
          echo "::error::No usable .NET SDK — see the output above. A missing or too-old SDK is fixed by rebuilding n3o-toolchain in n3oltd/devops; a malformed or unsatisfiable global.json is fixed in this repository." >&2
          exit 1
        fi

    - name: Install .NET SDK (GitHub-hosted)
      if: runner.environment == 'github-hosted'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
