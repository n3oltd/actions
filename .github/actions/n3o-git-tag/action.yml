name: n3o git tag
description: >-
  Pushes an annotated tag on the checked-out commit, and refuses one whose name is already taken.
  Works with a checkout that keeps no credentials.

inputs:
  name:
    description: The tag's name.
    required: true
  message:
    description: The tag's annotation.
    required: true
  token:
    description: Pushes the tag; needs contents write.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        NAME: ${{ inputs.name }}
        MESSAGE: ${{ inputs.message }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"

        if git rev-parse --quiet --verify "refs/tags/$NAME" > /dev/null || git ls-remote --exit-code --tags origin "refs/tags/$NAME" > /dev/null; then
          echo "::error::the tag $NAME already exists"
          exit 1
        fi

        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          tag -a "$NAME" -m "$MESSAGE"

        if ! git push --quiet origin "refs/tags/$NAME"; then
          git tag -d "$NAME"
          echo "::error::the tag $NAME could not be pushed"
          exit 1
        fi
