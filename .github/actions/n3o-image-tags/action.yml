name: n3o image tags
description: >-
  The one place the N3O container image version scheme lives. Computes a calver
  version from the date and the run number, the tags a build pushes, and the
  build timestamp for the OCI labels.

inputs:
  repository:
    description: Registry repository the image is pushed to, without the registry host.
    required: true
  registry:
    description: Container registry the image is pushed to.
    required: false
    default: n3oltd.azurecr.io
  channel:
    description: Release channel, main or vnext. Every tag the build pushes carries it.
    required: true
  commit-sha:
    description: >-
      The commit the image is built from. A caller that checks out a branch rather than
      github.sha must pass the SHA it actually resolved, since github.sha is the tip at dispatch
      and the two differ once a build has queued.
    required: false
    default: ${{ github.sha }}

outputs:
  version:
    description: The channel and the calver version, <channel>-<calver>.
    value: ${{ steps.tags.outputs.version }}
  version-tag:
    description: Fully qualified version tag, :<channel>-<calver>.
    value: ${{ steps.tags.outputs.version-tag }}
  channel-tag:
    description: Fully qualified moving tag, :<channel>.
    value: ${{ steps.tags.outputs.channel-tag }}
  sha-tag:
    description: Fully qualified commit tag, :<channel>-sha-<commit>.
    value: ${{ steps.tags.outputs.sha-tag }}
  created:
    description: RFC 3339 build timestamp for org.opencontainers.image.created.
    value: ${{ steps.tags.outputs.created }}

runs:
  using: "composite"
  steps:
    - id: tags
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.repository }}
        CHANNEL: ${{ inputs.channel }}
        RUN_NUMBER: ${{ github.run_number }}
        SHA: ${{ inputs.commit-sha }}
      run: |
        set -euo pipefail

        if [[ ! "$CHANNEL" =~ ^[a-z][a-z0-9]*$ ]]; then
          echo "::error::channel must be a lowercase name such as main or vnext, got '$CHANNEL'"
          exit 1
        fi

        NOW=$(date -u +'%Y.%-m.%-d')
        VERSION="${CHANNEL}-${NOW}.${RUN_NUMBER}"
        {
          echo "version=$VERSION"
          echo "version-tag=${IMAGE}:${VERSION}"
          echo "channel-tag=${IMAGE}:${CHANNEL}"
          echo "sha-tag=${IMAGE}:${CHANNEL}-sha-${SHA}"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        } >> "$GITHUB_OUTPUT"
