name: n3o source sync pulls
description: >-
  Keeps each pull request on a client's copy repository in step with a draft pull request on this
  repository, as the n3o-source-sync App: imports the client's commits under the subtree, sends
  N3O's commits back to the client's branch, copies comments both ways, and mirrors merging and
  closing. Run it after a checkout of main.

inputs:
  subtree-path:
    description: Path of the subtree the client repository copies (e.g. src/site-example).
    required: true
  client-repo:
    description: The client's copy repository, as owner/name (e.g. example-client/website).
    required: true
  branch-prefix:
    description: Prefix of the draft pull requests' branches; the client pull request's number is appended.
    required: true
  app-id:
    description: n3o-source-sync GitHub App id.
    required: true
  private-key:
    description: n3o-source-sync GitHub App private key.
    required: true
  token:
    description: Opens and updates the draft pull requests and pushes their branches.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: check inputs
      id: client
      shell: bash
      env:
        CLIENT_REPO: ${{ inputs.client-repo }}
      run: |
        if [[ ! "$CLIENT_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
          echo "::error::client-repo '$CLIENT_REPO' is not owner/name"; exit 1
        fi
        echo "owner=${CLIENT_REPO%%/*}" >> "$GITHUB_OUTPUT"

    - uses: n3oltd/actions/.github/actions/n3o-git-identity@main

    - id: app
      uses: n3oltd/actions/.github/actions/n3o-app-token@main
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.client.outputs.owner }}

    - name: sync pull requests
      id: sync
      shell: bash
      env:
        SUBTREE_PATH: ${{ inputs.subtree-path }}
        CLIENT_REPO: ${{ inputs.client-repo }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        CLIENT_TOKEN: ${{ steps.app.outputs.token }}
        SITES_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/sync.mjs"

    - if: steps.sync.outputs.merge-heads != ''
      uses: n3oltd/actions/.github/actions/n3o-snapshot-push@main
      with:
        subtree-path: ${{ inputs.subtree-path }}
        target-repo: ${{ inputs.client-repo }}
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        merge-heads: ${{ steps.sync.outputs.merge-heads }}
