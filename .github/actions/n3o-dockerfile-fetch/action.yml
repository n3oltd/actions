name: n3o dockerfile fetch
description: >-
  The one place the shared Dockerfile catalogue is addressed. Fetches a
  Dockerfile from this repository's docker/ directory, along with any companion
  assets it copies.

inputs:
  dockerfile:
    description: Catalogue Dockerfile name.
    required: true
  path:
    description: Where to write it. Defaults to the catalogue name, which collides when the calling repository has a directory of that name.
    required: false
    default: ''
  assets:
    description: Newline-separated docker/assets names to fetch alongside it, each written to the workspace root.
    required: false
    default: ''
  prefer-local:
    description: Use a Dockerfile already committed at this path instead of fetching. A repository committing its own keeps it under change detection; a bare name still resolves to the shared one.
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    # Fetched over HTTP: the calling workflow checks out its own repository, not this one.
    - shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        DEST: ${{ inputs.path }}
        ASSETS: ${{ inputs.assets }}
        PREFER_LOCAL: ${{ inputs.prefer-local }}
      run: |
        set -euo pipefail
        catalogue=https://raw.githubusercontent.com/n3oltd/actions/main/docker

        dest=${DEST:-$DOCKERFILE}

        if [ "$PREFER_LOCAL" = "true" ] && [ -f "$dest" ]; then
          echo "Using the Dockerfile committed at $dest"
        else
          # A directory of the same name makes curl exit with a write error that names nothing.
          [ -d "$dest" ] && { echo "$dest is a directory; pass a distinct path"; exit 1; }
          curl -fsSL -o "$dest" "$catalogue/$DOCKERFILE"
        fi

        while IFS= read -r asset; do
          if [ -n "$asset" ]; then
            curl -fsSL -o "$asset" "$catalogue/assets/$asset"
          fi
        done <<< "$ASSETS"
