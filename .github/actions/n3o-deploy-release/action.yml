name: n3o deploy release
description: >-
  Releases deployment targets with `n3o deploy release`, which resolves each target's version,
  releases it and records it. Does nothing when there is nothing to release.

inputs:
  targets:
    description: Space-separated target IDs or patterns.
    required: false
    default: ''
  ota-products:
    description: Space-separated product IDs whose ota targets in ota-environment are released too.
    required: false
    default: ''
  ota-environment:
    description: The environment the ota-products' targets are listed in.
    required: false
    default: qa
  access-token:
    description: Reads the n3oltd NuGet feed the CLI installs from.
    required: true
  azure-client-id:
    description: The CLI's Azure client id.
    required: true
  azure-client-secret:
    description: The CLI's Azure client secret.
    required: true
  azure-tenant-id:
    description: The CLI's Azure tenant id.
    required: true
  app-id:
    description: n3o-babar GitHub App id; the release is recorded against its identity.
    required: true
  private-key:
    description: n3o-babar GitHub App private key.
    required: true
  container-registry-username:
    description: Resolves image versions in the container registry; empty leaves the CLI's own.
    required: false
    default: ''
  container-registry-password:
    description: The container registry password.
    required: false
    default: ''
  npm-username:
    description: Resolves package versions in the n3oltd npm registry; empty leaves the CLI's own.
    required: false
    default: ''
  npm-password:
    description: The npm registry password.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - id: any
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        OTA_PRODUCTS: ${{ inputs.ota-products }}
      run: |
        if [ -z "${TARGETS//[[:space:]]/}${OTA_PRODUCTS//[[:space:]]/}" ]; then
          echo "Nothing to release."
          echo "any=false" >> "$GITHUB_OUTPUT"
        else
          echo "any=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.any.outputs.any == 'true'
      uses: n3oltd/actions/.github/actions/n3o-dotnet-cli-setup@main
      with:
        access-token: ${{ inputs.access-token }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-client-secret: ${{ inputs.azure-client-secret }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}

    - if: steps.any.outputs.any == 'true'
      uses: n3oltd/actions/.github/actions/n3o-git-identity@main
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - if: steps.any.outputs.any == 'true'
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        OTA_PRODUCTS: ${{ inputs.ota-products }}
        OTA_ENVIRONMENT: ${{ inputs.ota-environment }}
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
        AZURE_CLIENT_SECRET: ${{ inputs.azure-client-secret }}
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
        CONTAINER_REGISTRY_USERNAME: ${{ inputs.container-registry-username }}
        CONTAINER_REGISTRY_PASSWORD: ${{ inputs.container-registry-password }}
        NPM_USERNAME: ${{ inputs.npm-username }}
        NPM_PASSWORD: ${{ inputs.npm-password }}
      run: |
        set -euo pipefail

        if [ -n "$CONTAINER_REGISTRY_USERNAME" ]; then
          export ContainerRegistry__Username="$CONTAINER_REGISTRY_USERNAME"
          export ContainerRegistry__Password="$CONTAINER_REGISTRY_PASSWORD"
        fi

        if [ -n "$NPM_USERNAME" ]; then
          export Npm__Credentials__n3o__Username="$NPM_USERNAME"
          export Npm__Credentials__n3o__Password="$NPM_PASSWORD"
        fi

        read -r -d '' -a targets <<< "$TARGETS" || true

        for product in $OTA_PRODUCTS; do
          listed=$(n3o ota list --product "$product" --environment "$OTA_ENVIRONMENT")
          read -r -d '' -a found <<< "$listed" || true
          targets+=("${found[@]}")
        done

        if [ ${#targets[@]} -eq 0 ]; then
          echo "No targets to release."
          exit 0
        fi

        n3o deploy release "${targets[@]}"
