name: n3o npm version
description: >-
  The one place the N3O npm package version scheme lives: the UTC date and the run number, in the
  unpadded form the registry holds.

outputs:
  version:
    description: The package version.
    value: ${{ steps.version.outputs.version }}

runs:
  using: "composite"
  steps:
    - id: version
      shell: bash
      env:
        RUN_NUMBER: ${{ github.run_number }}
      run: echo "version=$(date -u +'%Y.%-m.%-d')-$RUN_NUMBER" >> "$GITHUB_OUTPUT"
