name: n3o ssh key
description: >-
  Installs an SSH private key (such as a deploy key) for git over SSH to github.com, and outputs
  the GIT_SSH_COMMAND that uses it.

inputs:
  private-key:
    description: SSH private key.
    required: true

outputs:
  git-ssh-command:
    description: Value for GIT_SSH_COMMAND that authenticates with the installed key.
    value: ${{ steps.key.outputs.git-ssh-command }}

runs:
  using: "composite"
  steps:
    - id: key
      shell: bash
      env:
        SSH_KEY: ${{ inputs.private-key }}   # via env: a multi-line key inlined into the script breaks it
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_n3o
        chmod 600 ~/.ssh/id_n3o
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
        echo "git-ssh-command=ssh -i $HOME/.ssh/id_n3o -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_OUTPUT"
