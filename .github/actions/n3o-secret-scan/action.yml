name: n3o secret scan
description: >-
  Fails when gitleaks finds a secret in the files under a directory. It scans the files as they
  are, not git history, and redacts what it finds in the log.

inputs:
  path:
    description: Directory to scan.
    required: true
  gitleaks-version:
    description: gitleaks release to install.
    required: false
    default: 8.30.1

runs:
  using: "composite"
  steps:
    - name: install gitleaks
      shell: bash
      env:
        VERSION: ${{ inputs.gitleaks-version }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::no gitleaks build for runner architecture $RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/gitleaks"
        archive="gitleaks_${VERSION}_linux_${arch}.tar.gz"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/$archive" "$base/$archive"
        curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${VERSION}_checksums.txt"
        (cd "$dir" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
        tar -xzf "$dir/$archive" -C "$dir" gitleaks
        echo "$dir" >> "$GITHUB_PATH"

    - name: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: gitleaks dir --no-banner --redact "$SCAN_PATH"
