name: n3o sentry events
description: >-
  Sends events to the Sentry project a DSN names, one envelope each, and gives an event without an
  event_id one of its own. Tries every event, then fails if Sentry did not accept them all.

inputs:
  dsn:
    description: The project's DSN.
    required: true
  events:
    description: A JSON array of Sentry event payloads. An empty array sends nothing.
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        DSN: ${{ inputs.dsn }}
        EVENTS: ${{ inputs.events }}
      run: |
        set -euo pipefail

        scheme=${DSN%%://*}
        rest=${DSN#*://}
        key=${rest%%@*}
        location=${rest#*@}
        project=${location##*/}
        host=${location%/*}
        if [ "$scheme" = "$DSN" ] || [ "$key" = "$rest" ] || [ "$host" = "$location" ] || [ -z "$project" ]; then
          echo "::error::dsn is not a Sentry DSN"
          exit 1
        fi

        if ! jq -e 'type == "array" and all(.[]; type == "object")' <<< "$EVENTS" > /dev/null 2>&1; then
          echo "::error::events is not a JSON array of objects"
          exit 1
        fi

        failed=0
        while IFS= read -r event; do
          id=$(jq -r '.event_id // empty' <<< "$event")
          [ -n "$id" ] || id=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
          payload=$(jq -c --arg id "$id" '.event_id = $id' <<< "$event")
          code=$(printf '{"event_id":"%s"}\n{"type":"event"}\n%s\n' "$id" "$payload" \
                 | curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST "$scheme://$host/api/$project/envelope/" \
                     -H "Content-Type: application/x-sentry-envelope" \
                     -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_client=n3o-sentry-events/1, sentry_key=$key" \
                     --data-binary @-) || code=000
          case "$code" in
            2*) echo "sent event $id" ;;
            *) echo "::error::Sentry did not accept event $id: HTTP $code"; failed=1 ;;
          esac
        done < <(jq -c '.[]' <<< "$EVENTS")

        exit "$failed"
