name: npm-publish
description: Publishes one or more npm packages, several at a time

inputs:
  access-token:
    description: A valid PAT with suitable permissions
    required: true

  package-directories:
    description: The list of package directories as a JSON array
    required: true

  version-suffix:
    type: string
    description: The Suffix to add to the package version
    required: false
    default: ''

  before-sha:
    description: When set, only packages whose own folder changed since this SHA are published (requires fetch-depth 0)
    required: false
    default: ''

  after-sha:
    description: Current SHA for the change comparison; defaults to HEAD
    required: false
    default: ''

  publish-all:
    description: Publish every listed package regardless of changes (bootstrap/force)
    required: false
    default: 'false'

  parallelism:
    description: How many packages to publish at once
    required: false
    default: '8'

runs:
  using: "composite"
  steps:
    - name: npm publish
      shell: bash
      run: |
        version=$(date -u +"%Y.%m.%d")-${{ github.run_number }}
        versionSuffix="${{ inputs.version-suffix }}"
        lock="$RUNNER_TEMP/npm-publish.lock"
        export version versionSuffix lock
        before="${{ inputs.before-sha }}"
        after="${{ inputs.after-sha }}"; [ -z "$after" ] && after=HEAD

        changed=()
        for packageDirectory in $(echo '${{ inputs.package-directories }}' | jq -c -r '.[]')
        do
          if [ "${{ inputs.publish-all }}" != "true" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            if git diff --quiet "$before" "$after" -- "$packageDirectory"; then
              echo "skip (unchanged): $packageDirectory"; continue
            fi
          fi
          changed+=("$packageDirectory")
        done

        publish() {
          cd "$1"
          if [ "$versionSuffix" != "" ]; then
            npm version $version --preid=$versionSuffix
          else
            npm version $version
          fi
          echo "//npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN" >> .npmrc
          echo "@n3oltd:registry=https://npm.pkg.github.com" >> .npmrc
          name=$(npm pkg get name | tr -d '"')
          effective=$(npm pkg get version | tr -d '"')
          # An already-published version means a rerun after a partial publish: done, not an error.
          if npm view "$name@$effective" version > /dev/null 2>&1; then
            echo "skip (already published): $name@$effective"
          elif [ "$versionSuffix" != "" ]; then
            npm publish --tag=$versionSuffix
          else
            npm publish --tag=latest
          fi
          # prepack installs a per-package node_modules; across hundreds of packages that fills the disk.
          rm -rf node_modules
        }
        export -f publish

        [ ${#changed[@]} -eq 0 ] && exit 0

        printf '%s\n' "${changed[@]}" | xargs -P "${{ inputs.parallelism }}" -I{} bash -c '
          log=$(mktemp -p "$RUNNER_TEMP")
          (set -eo pipefail; publish "$1") > "$log" 2>&1
          status=$?
          {
            flock 9
            echo "::group::$1"
            cat "$log"
            echo "::endgroup::"
            [ $status -eq 0 ] || echo "::error::npm publish failed for $1"
          } 9> "$lock"
          rm -f "$log"
          [ $status -eq 0 ]' _ {}
      working-directory: ${{github.workspace}}
      env:
        NODE_AUTH_TOKEN: ${{inputs.access-token}}
