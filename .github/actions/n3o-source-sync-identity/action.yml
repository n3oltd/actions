name: n3o source sync identity
description: >-
  Checks a client repository's name and gives what writing to it as the n3o-source-sync App needs:
  the owner to mint the App's token for, and the name and email its commits carry.

inputs:
  repo:
    description: The client repository, as owner/name (e.g. example-client/website).
    required: true

outputs:
  owner:
    description: The repository's owner.
    value: ${{ steps.check.outputs.owner }}
  name:
    description: The App's commit name.
    value: n3o-source-sync[bot]
  email:
    description: The App's commit email.
    value: 354428725+n3o-source-sync[bot]@users.noreply.github.com

runs:
  using: "composite"
  steps:
    - name: check repository
      id: check
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
      run: |
        if [[ ! "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
          echo "::error::'$REPO' is not owner/name"; exit 1
        fi
        echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
