# Builds and pushes the N3O SQL Server Docker image to ACR with date and
# latest tags, fetching the Dockerfile from the actions repo. Takes no
# inputs.
name: 'docker-build-push-mssql'

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-push-docker-image-job:

    # GitHub-hosted: the self-hosted runner group excludes public repositories.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - id: acr
        name: acr login
        uses: n3oltd/actions/.github/actions/n3o-acr-login@main
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: fetch dockerfile
        uses: n3oltd/actions/.github/actions/n3o-dockerfile-fetch@main
        with:
          dockerfile: mssql

      - id: meta
        name: prepare mssql
        uses: n3oltd/actions/.github/actions/n3o-image-tags@main
        with:
          repository: n3o-mssql

      - name: build and push mssql
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.acr.outputs.builder }}
          context: .
          target: final
          file: mssql
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.version-tag }} , ${{ steps.meta.outputs.latest-tag }}
