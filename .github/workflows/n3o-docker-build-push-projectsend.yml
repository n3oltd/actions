name: 'docker-build-push-projectsend'

on:
  workflow_call:
    inputs:
      channel:
        description: release channel, main or vnext. Every tag the build pushes carries it.
        type: string
        required: true
      mode:
        description: "runner mode: wait (self-hosted, free, queue) or fast (GitHub-hosted, immediate, billable)."
        type: string
        required: false
        default: wait
  workflow_dispatch:
    inputs:
      channel:
        description: release channel, main or vnext. Every tag the build pushes carries it.
        type: string
        required: true

jobs:
  pick:
    uses: n3oltd/actions/.github/workflows/n3o-pick-runner.yml@main
    with:
      mode: ${{ inputs.mode || 'wait' }}

  build-push-docker-image-job:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - id: acr
        name: acr login
        uses: n3oltd/actions/.github/actions/n3o-acr-login@main
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # A distinct path: the calling repository has a projectsend directory.
      - name: fetch dockerfile
        uses: n3oltd/actions/.github/actions/n3o-dockerfile-fetch@main
        with:
          dockerfile: projectsend
          path: Dockerfile.projectsend

      - id: meta
        name: prepare projectsend
        uses: n3oltd/actions/.github/actions/n3o-image-tags@main
        with:
          repository: n3o-projectsend
          channel: ${{ inputs.channel }}

      # Stated, not inherited: an arm64 image builds clean and fails at container start.
      - name: build and push projectsend
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.acr.outputs.builder }}
          context: .
          target: final
          file: Dockerfile.projectsend
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.version-tag }} , ${{ steps.meta.outputs.channel-tag }} , ${{ steps.meta.outputs.sha-tag }}
