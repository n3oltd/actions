# Reusable workflow that builds the solution, runs the n3o CLI to regenerate API clients, and
# opens a PR with any changes. The client-bearing repos call this; the machinery it is a
# preset of lives in n3o-dotnet-generate.yml.
name: dotnet generate clients

on:
  workflow_call:
    inputs:
      working-directory:
        description: directory (relative to the repo root) to run the build/commands in
        type: string
        default: src

      fast:
        description: 'Fast: build on a GitHub-hosted runner (immediate, billable) instead of the self-hosted fleet (queued, free)'
        type: boolean
        default: false

jobs:
  generate:
    uses: n3oltd/actions/.github/workflows/n3o-dotnet-generate.yml@main
    with:
      command: clients generate
      paths: ${{ inputs.working-directory }}
      branch-prefix: regenerate-clients
      pr-title: Regenerate OpenAPI clients
      pr-body: Automated client regeneration via generate-clients. no-work-issue
      working-directory: ${{ inputs.working-directory }}
      build: true
      fast: ${{ inputs.fast }}
    secrets: inherit
