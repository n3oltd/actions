# Builds, optionally tests and packs a .NET project, pushes any NuGet packages to the configured
# feed, and optionally creates a Sentry release, through the dotnet-build-pack-push action. A
# repository that publishes to nuget.org with Trusted Publishing uses that action in a job of its
# own workflow instead, since nuget.org accepts only a token from the publishing repository's own
# workflow file.
name: 'dotnet-build-pack-push'

on:
  workflow_call:
    inputs:
      runs-on:
        description: runner label the job executes on
        type: string
        default: ubuntu-latest

      dotnet-version:
        description: .NET SDK version to set up
        type: string
        default: 10.x

      setup-node:
        description: >-
          whether to set up Node.js (and cache ~/.npm + .turbo) before the build.
          Enable for repos whose MSBuild build runs npm/Turbo (e.g. backoffice
          frontend plugins). The version is read from a .nvmrc at the repo root.
        type: boolean
        default: false

      working-directory:
        description: directory (relative to the repo root) to run the build/commands in
        type: string
        default: src

      build-configuration:
        description: build configuration (e.g. Release)
        type: string
        default: Release

      run-tests:
        description: whether to run tests
        type: boolean
        default: false

      run-pack:
        description: whether to create NuGet packages
        type: boolean
        default: false

      version-strategy:
        description: how the version is derived ('tag' from git tag, 'date' for date-based)
        type: string
        default: tag
        # 'tag': version from git tag (refs/tags/v*), fallback 1.0.0
        # 'date': date-based version (YYYY.M.D.run_number)

      version:
        description: explicit version to use; overrides version-strategy when set
        type: string
        default: ''
        # If set, takes precedence over version-strategy. Use when the caller
        # has already computed the version (e.g. scheduled releases triggered
        # from a branch rather than a tag).

      nuget-source:
        description: NuGet feed to push packages to
        type: string
        default: 'https://api.nuget.org/v3/index.json'

      version-suffix:
        description: optional prerelease suffix appended to the version
        type: string
        default: ''

      sentry-project:
        description: Sentry project slug for the release and sourcemaps (empty to skip Sentry)
        type: string
        required: false
        default: ''

    secrets:
      nuget-api-key:
        required: false

      sentry-auth-token:
        required: false

      sixlabors-license:
        required: false

jobs:
  job1:
    name: ${{ inputs.runs-on }}

    runs-on: ${{ inputs.runs-on }}

    steps:
      - uses: n3oltd/actions/.github/actions/dotnet-build-pack-push@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          setup-node: ${{ inputs.setup-node }}
          working-directory: ${{ inputs.working-directory }}
          build-configuration: ${{ inputs.build-configuration }}
          run-tests: ${{ inputs.run-tests }}
          run-pack: ${{ inputs.run-pack }}
          version-strategy: ${{ inputs.version-strategy }}
          version: ${{ inputs.version }}
          version-suffix: ${{ inputs.version-suffix }}
          nuget-source: ${{ inputs.nuget-source }}
          nuget-api-key: ${{ secrets.nuget-api-key }}
          sentry-project: ${{ inputs.sentry-project }}
          sentry-auth-token: ${{ secrets.sentry-auth-token }}
          sixlabors-license: ${{ secrets.sixlabors-license }}
