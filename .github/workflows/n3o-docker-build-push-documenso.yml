name: 'docker-build-push-documenso'

on:
  workflow_call:
    inputs:
      channel:
        description: release channel, main or vnext. Every tag the build pushes carries it.
        type: string
        required: true
      mode:
        description: "runner mode: wait (self-hosted, free, queue) or fast (GitHub-hosted, immediate, billable)."
        type: string
        required: false
        default: wait
  workflow_dispatch:
    inputs:
      channel:
        description: release channel, main or vnext. Every tag the build pushes carries it.
        type: string
        required: true

jobs:
  pick:
    uses: n3oltd/actions/.github/workflows/n3o-pick-runner.yml@main
    with:
      mode: ${{ inputs.mode || 'wait' }}

  build-push-docker-image-job:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - id: acr
        name: acr login
        uses: n3oltd/actions/.github/actions/n3o-acr-login@main
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: fetch dockerfile
        uses: n3oltd/actions/.github/actions/n3o-dockerfile-fetch@main
        with:
          dockerfile: documenso

      - id: meta
        name: prepare documenso
        uses: n3oltd/actions/.github/actions/n3o-image-tags@main
        with:
          repository: n3o-documenso
          channel: ${{ inputs.channel }}

      # Stated rather than inherited: upstream publishes multi-arch, and an arm64
      # build reaches the cluster as an exec format error at container start rather
      # than as a failed build.
      #
      # pull: true because this image is a mirror -- without it a runner with a
      # cached layer can republish an older upstream under a new date tag.
      - name: build and push documenso
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.acr.outputs.builder }}
          context: .
          target: final
          file: documenso
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.version-tag }} , ${{ steps.meta.outputs.channel-tag }} , ${{ steps.meta.outputs.sha-tag }}
