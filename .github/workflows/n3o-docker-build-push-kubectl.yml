# Builds and pushes the N3O kubectl Docker image to ACR with date and latest
# tags, fetching the Dockerfile from the actions repo. Runs on the self-hosted fleet
# unless the caller asks for fast.
name: 'docker-build-push-kubectl'

on:
  workflow_call:
    inputs:
      mode:
        description: "runner mode: wait (self-hosted, free, queue) or fast (GitHub-hosted, immediate, billable)."
        type: string
        required: false
        default: wait
  workflow_dispatch:

jobs:
  pick:
    uses: n3oltd/actions/.github/workflows/n3o-pick-runner.yml@main
    with:
      mode: ${{ inputs.mode || 'wait' }}

  build-push-docker-image-job:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - id: acr
        name: acr login
        uses: n3oltd/actions/.github/actions/n3o-acr-login@main
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: fetch dockerfile
        uses: n3oltd/actions/.github/actions/n3o-dockerfile-fetch@main
        with:
          dockerfile: kubectl

      - id: meta
        name: prepare kubectl
        uses: n3oltd/actions/.github/actions/n3o-image-tags@main
        with:
          repository: n3o-kubectl

      - name: build and push kubectl
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.acr.outputs.builder }}
          context: .
          target: final
          file: kubectl
          push: true
          tags: ${{ steps.meta.outputs.version-tag }} , ${{ steps.meta.outputs.latest-tag }}
