# Builds and pushes the N3O LiteLLM image to ACR with date and latest tags, from
# LiteLLM's newest stable release once its signature verifies, fetching the
# Dockerfile from the actions repo. Runs on the self-hosted fleet unless the
# caller asks for fast.
name: 'docker-build-push-litellm'

on:
  workflow_call:
    inputs:
      mode:
        description: "runner mode: wait (self-hosted, free, queue) or fast (GitHub-hosted, immediate, billable)."
        type: string
        required: false
        default: wait
  workflow_dispatch:

env:
  UPSTREAM: ghcr.io/berriai/litellm
  # LiteLLM's public key at the commit its release notes name. A key read from
  # main could be replaced along with the image it vouches for.
  UPSTREAM_KEY: https://raw.githubusercontent.com/BerriAI/litellm/0112e53046018d726492c814b3644b7d376029d0/cosign.pub

jobs:
  pick:
    uses: n3oltd/actions/.github/workflows/n3o-pick-runner.yml@main
    with:
      mode: ${{ inputs.mode || 'wait' }}

  build-push-docker-image-job:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - id: acr
        name: acr login
        uses: n3oltd/actions/.github/actions/n3o-acr-login@main
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # An explicit path: the calling repository has a litellm directory for the
      # bare catalogue name to collide with.
      - name: fetch dockerfile
        uses: n3oltd/actions/.github/actions/n3o-dockerfile-fetch@main
        with:
          dockerfile: litellm
          path: Dockerfile.litellm

      # GitHub's latest release, which LiteLLM marks only on a stable one; the
      # pattern refuses a release candidate or nightly marked by mistake.
      - id: upstream
        name: resolve the newest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/BerriAI/litellm/releases/latest --jq .tag_name)
          if ! [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Not a stable release::LiteLLM's latest release is ${release}"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "${UPSTREAM}:${release}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not resolve ${release} to a digest"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "LiteLLM ${release} is ${digest}"

      - uses: sigstore/cosign-installer@v4

      # The digest verified here is the digest built from, so nothing published
      # between the check and the build can be substituted.
      - name: verify the signature
        env:
          DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key "$UPSTREAM_KEY" "${UPSTREAM}@${DIGEST}" >/dev/null

      - id: meta
        name: prepare litellm
        uses: n3oltd/actions/.github/actions/n3o-image-tags@main
        with:
          repository: n3o-litellm

      # Stated rather than inherited: upstream publishes multi-arch, and an arm64
      # build reaches Container Apps as an exec format error at container start
      # rather than as a failed build.
      #
      # The base labels are what the deploy reads to record which release a
      # federation runs.
      - name: build and push litellm
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.acr.outputs.builder }}
          context: .
          target: final
          file: Dockerfile.litellm
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            LITELLM_DIGEST=${{ steps.upstream.outputs.digest }}
          tags: ${{ steps.meta.outputs.version-tag }} , ${{ steps.meta.outputs.latest-tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.base.name=${{ env.UPSTREAM }}:${{ steps.upstream.outputs.release }}
            org.opencontainers.image.base.digest=${{ steps.upstream.outputs.digest }}
