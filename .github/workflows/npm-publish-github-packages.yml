# Reusable workflow that builds and publishes an npm package to GitHub Packages.
# Installs deps, builds, stamps a date-based version, then runs npm publish against npm.pkg.github.com.
# Call it from a release workflow when shipping a package to the org's GitHub Packages registry.
name: Publish NPM package to GitHub Packages

on:
  workflow_call:
    inputs:
      working-directory:
        description: directory (relative to the repo root) to run the build/commands in
        type: string
        default: src

      retention-days:
        description: The number of days the published version is kept; when empty the package is published unstamped
        type: string
        default: ''

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node
        uses: n3oltd/actions/.github/actions/n3o-node-setup@main
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: npm install and build
        run: |
          npm install
          npm run build
        env:
          NODE_AUTH_TOKEN: ${{ env.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}
          
      - name: stamp the retention period
        if: inputs.retention-days != ''
        uses: n3oltd/actions/.github/actions/n3o-package-retention-stamp@main
        with:
          retention-days: ${{ inputs.retention-days }}
          npm-package-directories: ${{ format('[{0}]', toJSON(inputs.working-directory)) }}

      - name: npm publish
        run: |
          cp README.md dist/README.md
          cp package.json dist/package.json          
          version=$(date -u +"%Y.%m.%d")-${{ github.run_number }}          
          npm version $version --git-tag-version=false
          npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ env.GH_PAT }}
          NPM_CONFIG_LOGLEVEL: verbose
        working-directory: ${{ inputs.working-directory }}
