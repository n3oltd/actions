# Builds a Create React App project on React-App-Runner, a GitHub-hosted larger runner.
# Verification only: despite the name, nothing here uploads, publishes or creates a release.
#
# The caller supplies its own .npmrc, which names the registry and reads its token from GH_PAT.
# Its engines.node must admit the version set below, because engine-strict is then in effect.
name: react app build and publish

on:
  workflow_call:

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  build-publish:
    
    runs-on: React-App-Runner

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node
        uses: n3oltd/actions/.github/actions/n3o-node-setup@main
        with:
          node-version: '24.x'

      - name: npm install and build
        run: |
          export GENERATE_SOURCEMAP=true
          export SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          export NODE_OPTIONS="--max-old-space-size=8192 --openssl-legacy-provider"
          npm install -g react-scripts
          npm install -g react-app-rewired
          npm install
          #npm run test
          npm run build
        working-directory: ${{ github.workspace }}
