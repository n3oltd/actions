name: n3o mobile ota publish

on:
  workflow_call:
    inputs:
      family:
        description: The bundle family; passed to the commands below as FAMILY.
        type: string
        required: true
      app-path:
        description: The Capacitor project.
        type: string
        required: true
      output-path:
        description: The built folder, relative to app-path.
        type: string
        default: dist
      build-command:
        description: Builds the bundle, run in app-path with BUNDLE_VERSION set.
        type: string
        required: true
      check-command:
        description: Run in app-path before a new version is built; empty runs nothing.
        type: string
        default: ''
      next-version-command:
        description: Prints the family's next version, run at the root after every tag is fetched; it gets no token.
        type: string
        required: true
      assert-version-command:
        description: Exits non-zero to refuse VERSION as a bundle version of FAMILY, run at the root after every tag is fetched; it gets no token.
        type: string
        required: true
      tree-hash-command:
        description: Prints the identity hash of the folder DIRECTORY, run at the root.
        type: string
        required: true
      min-update-version-command:
        description: Prints the oldest native version the bundle runs on, run in app-path.
        type: string
        required: true
      tag-prefix:
        description: Prefixes the version to name the bundle's tag, such as ota-<family>/.
        type: string
        required: true
      apps:
        description: Space-separated Capgo app IDs to upload to.
        type: string
        required: true
      channel:
        description: The apps' upload-default channel, which no device reads.
        type: string
        default: sink
      version:
        description: An already published version to upload to the apps instead of publishing a new one.
        type: string
        default: ''
      sentry-project:
        description: Sentry project for the bundle's source maps; empty uploads none.
        type: string
        default: ''
      sentry-release:
        description: The Sentry release the source maps go to; {version} is replaced by the bundle version.
        type: string
        default: '{version}'
      node-version-file:
        description: File to read the Node version from.
        type: string
        default: .nvmrc
      install-command:
        description: Installs the repository's dependencies.
        type: string
        default: pnpm install --frozen-lockfile
      fast:
        description: Run on a GitHub-hosted runner instead of the self-hosted fleet.
        type: boolean
        default: false
    secrets:
      gh-pat:
        description: Reads the n3oltd npm packages.
        required: true
      capgo-api-key:
        description: Uploads to the apps and promotes to their upload-default channel only.
        required: true
      capgo-signing-key:
        description: The family's key-v2 private key.
        required: true
      sentry-auth-token:
        description: Uploads the source maps.
        required: false

permissions: {}

jobs:
  pick:
    uses: n3oltd/actions/.github/workflows/n3o-pick-runner.yml@main
    with:
      mode: ${{ inputs.fast && 'fast' || 'wait' }}

  publish:
    name: publish ${{ inputs.family }}
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}
    concurrency:
      group: ${{ inputs.version == '' && format('n3o-mobile-ota-publish-{0}-{1}', github.repository, inputs.family) || format('n3o-mobile-ota-upload-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      FAMILY: ${{ inputs.family }}
      APP_PATH: ${{ inputs.app-path }}
      OUTPUT_PATH: ${{ inputs.output-path }}
      BUILT: ${{ inputs.app-path }}/${{ inputs.output-path }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version != '' && format('refs/tags/{0}{1}', inputs.tag-prefix, inputs.version) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: n3oltd/actions/.github/actions/n3o-main-only@main

      - uses: n3oltd/actions/.github/actions/n3o-capgo-key-check@main
        with:
          signing-key: ${{ secrets.capgo-signing-key }}
          working-directory: ${{ inputs.app-path }}

      - uses: n3oltd/actions/.github/actions/n3o-node-setup@main
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: https://npm.pkg.github.com
          scope: "@n3oltd"
          pnpm: "true"

      - name: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.gh-pat }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: check
        if: inputs.check-command != '' && inputs.version == ''
        working-directory: ${{ inputs.app-path }}
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: bash -c "$CHECK_COMMAND"

      - name: fetch every tag
        uses: n3oltd/actions/.github/actions/n3o-git-authenticated@main
        with:
          run: git fetch --quiet --force --tags origin

      - id: version
        name: fix the version
        env:
          REQUESTED: ${{ inputs.version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          NEXT_VERSION_COMMAND: ${{ inputs.next-version-command }}
          ASSERT_VERSION_COMMAND: ${{ inputs.assert-version-command }}
          SENTRY_RELEASE: ${{ inputs.sentry-release }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED" ]; then
            tag="$TAG_PREFIX$REQUESTED"
          else
            tag=$(git tag --points-at HEAD --list "$TAG_PREFIX*" | sort -V | tail -n 1)
          fi

          if [ -n "$tag" ]; then
            existing=true
            version=${tag#"$TAG_PREFIX"}
            expected=$(git tag --list --format='%(contents)' "$tag" | sed -n 's/^tree-sha256: //p')

            if [ -z "$expected" ]; then
              echo "::error::$tag carries no tree hash"
              exit 1
            fi
          else
            existing=false
            version=$(bash -c "$NEXT_VERSION_COMMAND")
            tag="$TAG_PREFIX$version"
            expected=
          fi

          VERSION="$version" bash -c "$ASSERT_VERSION_COMMAND"

          {
            echo "existing=$existing"
            echo "version=$version"
            echo "tag=$tag"
            echo "expected=$expected"
            echo "commit=$(git rev-parse HEAD)"
            echo "sentry-release=${SENTRY_RELEASE//\{version\}/$version}"
          } >> "$GITHUB_OUTPUT"

      - id: released
        if: steps.version.outputs.existing == 'true'
        uses: n3oltd/actions/.github/actions/n3o-release-assets@main
        with:
          tag: ${{ steps.version.outputs.tag }}
          mode: download
          files: bundle.tar.gz
          directory: ${{ runner.temp }}/release
          if-missing: ${{ inputs.version == '' && 'skip' || 'fail' }}

      - name: unpack the published bundle
        if: steps.released.outputs.found == 'true'
        run: |
          set -euo pipefail
          rm -rf "$BUILT"
          mkdir -p "$BUILT"
          tar -xzf "$RUNNER_TEMP/release/bundle.tar.gz" -C "$BUILT"

      - name: build
        if: steps.released.outputs.found != 'true'
        working-directory: ${{ inputs.app-path }}
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          bash -c "$BUILD_COMMAND"

      - id: maps
        if: steps.released.outputs.found != 'true'
        uses: n3oltd/actions/.github/actions/n3o-sentry-inject@main
        with:
          path: ${{ env.BUILT }}
          maps: ${{ runner.temp }}/sourcemaps

      - id: hash
        name: identify the bundle
        env:
          EXPECTED: ${{ steps.version.outputs.expected }}
          TAG: ${{ steps.version.outputs.tag }}
          TREE_HASH_COMMAND: ${{ inputs.tree-hash-command }}
        run: |
          set -euo pipefail

          hash=$(DIRECTORY="$BUILT" bash -c "$TREE_HASH_COMMAND")

          if [ -n "$EXPECTED" ] && [ "$hash" != "$EXPECTED" ]; then
            echo "::error::the bundle's tree hash $hash differs from $TAG's $EXPECTED"
            exit 1
          fi

          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: tag the commit
        if: steps.version.outputs.existing == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "$TAG" -m "tree-sha256: $HASH"

      - name: push the tag
        if: steps.version.outputs.existing == 'false'
        uses: n3oltd/actions/.github/actions/n3o-git-authenticated@main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          run: git -c core.hooksPath=/dev/null push --quiet origin "refs/tags/$TAG" && git fetch --quiet --force --tags origin

      - name: assert the version again
        if: steps.version.outputs.existing == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSERT_VERSION_COMMAND: ${{ inputs.assert-version-command }}
        run: bash -c "$ASSERT_VERSION_COMMAND"

      - if: steps.maps.outputs.found == 'true' && inputs.sentry-project != ''
        uses: n3oltd/actions/.github/actions/n3o-sentry-release@main
        with:
          project: ${{ inputs.sentry-project }}
          release: ${{ steps.version.outputs.sentry-release }}
          sourcemaps: ${{ runner.temp }}/sourcemaps
          auth-token: ${{ secrets.sentry-auth-token }}

      - name: pack the bundle
        if: steps.released.outputs.found != 'true'
        run: tar -C "$BUILT" -czf "$RUNNER_TEMP/bundle.tar.gz" .

      - id: release
        if: steps.released.outputs.found != 'true'
        uses: n3oltd/actions/.github/actions/n3o-release-assets@main
        with:
          tag: ${{ steps.version.outputs.tag }}
          mode: attach
          files: ${{ runner.temp }}/bundle.tar.gz
          notes: The ${{ inputs.family }} OTA bundle ${{ steps.version.outputs.version }}, tree-sha256 ${{ steps.hash.outputs.hash }}.

      - id: minimum
        name: read the native floor
        working-directory: ${{ inputs.app-path }}
        env:
          MIN_UPDATE_VERSION_COMMAND: ${{ inputs.min-update-version-command }}
        run: |
          set -euo pipefail

          minimum=$(bash -c "$MIN_UPDATE_VERSION_COMMAND")

          if [ -z "$minimum" ] || [ "$minimum" = null ]; then
            echo "::error::the native floor command printed no version"
            exit 1
          fi

          echo "version=$minimum" >> "$GITHUB_OUTPUT"

      - uses: n3oltd/actions/.github/actions/n3o-capgo-upload@main
        with:
          apps: ${{ inputs.apps }}
          path: ${{ inputs.output-path }}
          version: ${{ steps.version.outputs.version }}
          channel: ${{ inputs.channel }}
          min-update-version: ${{ steps.minimum.outputs.version }}
          comment: ${{ steps.version.outputs.tag }} ${{ steps.version.outputs.commit }}
          link: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          api-key: ${{ secrets.capgo-api-key }}
          signing-key: ${{ secrets.capgo-signing-key }}
          working-directory: ${{ inputs.app-path }}
