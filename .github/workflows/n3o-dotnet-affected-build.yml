# Reusable workflow: build only the projects affected between two commits (and their dependents).
name: dotnet affected build

on:
  workflow_call:
    inputs:
      from:
        description: Base commit to diff from; empty / zero-sha falls back to <to>~1.
        type: string
        default: ''
      to:
        description: Head commit to diff to.
        type: string
        required: true
      build-configuration:
        type: string
        default: Release
      after-build:
        description: >-
          Shell command run in the build job once the affected projects are built, reading their output.
          AFFECTED_PROJECTS_FILE names a file listing the built project files, one repo-relative path per
          line, and BUILD_CONFIGURATION is set; the step is skipped when nothing is affected.
        type: string
        default: ''
      mode:
        description: "wait (self-hosted, free, queued) or fast (GitHub-hosted, billable)."
        type: string
        default: wait
    outputs:
      affected-projects:
        description: "JSON array of affected project names (.csproj basenames, incl. dependents); '[]' when none."
        value: ${{ jobs.build.outputs.affected-projects }}

jobs:
  pick:
    uses: n3oltd/actions/.github/workflows/n3o-pick-runner.yml@main
    with:
      mode: ${{ inputs.mode }}
    secrets: inherit

  build:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}
    outputs:
      affected-projects: ${{ steps.affected.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dotnet-affected diffs from..to; needs full history
          filter: blob:none

      - uses: n3oltd/actions/.github/actions/n3o-dotnet-setup@main

      - name: install dotnet-affected
        shell: bash
        run: |
          dotnet tool install --global dotnet-affected
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: compute affected
        id: affected
        shell: bash
        env:
          FROM_SHA: ${{ inputs.from }}
          TO_SHA: ${{ inputs.to }}
        run: |
          base="$FROM_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="${TO_SHA}~1"; fi

          changed="$(git diff --name-only "$base" "$TO_SHA")"

          full_scope() {
            find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' \
              | sed 's#^\./##' | sort > "$RUNNER_TEMP/affected-projects.txt"
            projects="$(sed -E 's#.*/##; s/\.csproj$//' "$RUNNER_TEMP/affected-projects.txt" \
              | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')"
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "projects=$projects" >> "$GITHUB_OUTPUT"
          }

          # A genuinely-global config change (props/rsp/global.json/nuget.config) alters the build for
          # EVERY project — build the whole solution. Per-project files (.csproj/.slnx/lock) stay on
          # the affected path below.
          global='(^|/)(Directory\.Build\.props|Directory\.Build\.rsp|Directory\.Packages\.props|global\.json|nuget\.config)$'
          if grep -qiE "$global" <<< "$changed"; then
            full_scope
            exit 0
          fi

          # dotnet-affected: the changed projects + their dependents. It doesn't reliably trace a
          # brand-new project's dependency edge, so the build step also builds the directly-changed
          # .csproj explicitly (changed-csprojs).
          set +e
          dotnet affected --from "$base" --to "$TO_SHA" --format traversal --output-dir "$RUNNER_TEMP" --output-name affected
          affected_rc=$?
          set -e

          # 166 is dotnet-affected's "nothing is affected"; on any other failure the scope is unknown,
          # and a partial build would pass this gate having compiled almost nothing.
          if [ "$affected_rc" -ne 0 ] && [ "$affected_rc" -ne 166 ]; then
            echo "::warning title=dotnet-affected failed::Exit code $affected_rc, so the scope is unknown and the whole tree is built."
            full_scope
            exit 0
          fi

          echo "scope=affected" >> "$GITHUB_OUTPUT"

          # GitHub runs steps with `bash -e -o pipefail`, so a grep that matches nothing (exit 1)
          # aborts the step. Guard each grep that may legitimately find nothing with `|| true`.
          : > "$RUNNER_TEMP/changed-csprojs.txt"
          printf '%s\n' "$changed" | { grep -E '\.csproj$' || true; } | while read -r c; do
            [ -f "$c" ] && printf '%s\n' "$(cd "$(dirname "$c")" && pwd)/$(basename "$c")" >> "$RUNNER_TEMP/changed-csprojs.txt"
          done

          if [ -f "$RUNNER_TEMP/affected.proj" ] || [ -s "$RUNNER_TEMP/changed-csprojs.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

          aff=''
          [ -f "$RUNNER_TEMP/affected.proj" ] && aff="$({ grep -oE 'Include="[^"]+\.csproj"' "$RUNNER_TEMP/affected.proj" || true; } | sed -E 's/.*[\/\\]//; s/\.csproj"$//')"
          chg="$(sed -E 's#.*/##; s/\.csproj$//' "$RUNNER_TEMP/changed-csprojs.txt" 2>/dev/null)"
          projects="$(printf '%s\n%s\n' "$aff" "$chg" | { grep -v '^$' || true; } | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

          {
            [ -f "$RUNNER_TEMP/affected.proj" ] && { grep -oE 'Include="[^"]+\.csproj"' "$RUNNER_TEMP/affected.proj" || true; } | sed -E 's/^Include="//; s/"$//'
            cat "$RUNNER_TEMP/changed-csprojs.txt"
          } | while read -r p; do realpath -m --relative-to="$PWD" "$p"; done | sort -u > "$RUNNER_TEMP/affected-projects.txt"

      - name: build affected
        if: steps.affected.outputs.any == 'true'
        shell: bash
        env:
          GH_USERNAME: n3oltd
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cfg="${{ inputs.build-configuration }}"
          # Peak MSBuild memory scales with node count, so parallelism is capped rather than
          # taken from the core count. These builds run in sequence, so node reuse is worth
          # its memory and is re-enabled over a repo response file that declines it.
          if [ "${{ steps.affected.outputs.scope }}" = "full" ]; then
            dotnet build -c "$cfg" -m:4 -nodeReuse:true
          else
            [ -f "$RUNNER_TEMP/affected.proj" ] && dotnet build "$RUNNER_TEMP/affected.proj" -c "$cfg" -m:4 -nodeReuse:true
            while read -r c; do [ -n "$c" ] && dotnet build "$c" -c "$cfg" -m:4 -nodeReuse:true; done < "$RUNNER_TEMP/changed-csprojs.txt"
          fi

      - name: after build
        if: inputs.after-build != '' && steps.affected.outputs.any == 'true'
        shell: bash
        env:
          AFFECTED_PROJECTS_FILE: ${{ runner.temp }}/affected-projects.txt
          BUILD_CONFIGURATION: ${{ inputs.build-configuration }}
          AZURE_CLIENT_ID: ${{ secrets.N3O_CLI_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.N3O_CLI_AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.N3O_CLI_AZURE_TENANT_ID }}
          GH_USERNAME: n3oltd
          GH_PAT: ${{ secrets.GH_PAT }}
        run: ${{ inputs.after-build }}
