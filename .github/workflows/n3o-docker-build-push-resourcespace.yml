# Builds and pushes the two N3O ResourceSpace images to ACR with date and latest
# tags, fetching the Dockerfiles from the actions repo. Runs on the self-hosted fleet
# unless the caller asks for fast.
name: 'docker-build-push-resourcespace'

on:
  workflow_call:
    inputs:
      mode:
        description: "runner mode: wait (self-hosted, free, queue) or fast (GitHub-hosted, immediate, billable)."
        type: string
        required: false
        default: wait
  workflow_dispatch:

jobs:
  pick:
    uses: n3oltd/actions/.github/workflows/n3o-pick-runner.yml@main
    with:
      mode: ${{ inputs.mode || 'wait' }}

  # A job per image, so each gets a runner and a Docker storage of its own. The two
  # do not fit in one: the application image carries libopencv-dev and ffmpeg, the
  # CLIP image carries PyTorch and a 1.5 GB model, and a fleet runner's daemon
  # storage is a 30 GiB emptyDir that the pod is evicted for exceeding -- which
  # presents as the job ending mid-step with no log and no error.
  #
  # They still share a version, because the tag comes from the run rather than the
  # job, so a mismatched pair cannot be produced or deployed.
  application:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - id: acr
        name: acr login
        uses: n3oltd/actions/.github/actions/n3o-acr-login@main
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # An explicit path: the calling repository has a resourcespace directory for
      # the bare catalogue name to collide with.
      - name: fetch dockerfile and assets
        uses: n3oltd/actions/.github/actions/n3o-dockerfile-fetch@main
        with:
          dockerfile: resourcespace
          path: Dockerfile.resourcespace
          assets: |
            resourcespace-entrypoint.sh
            resourcespace-fork.sh
            resourcespace-render-config.php

      - id: meta
        name: prepare resourcespace
        uses: n3oltd/actions/.github/actions/n3o-image-tags@main
        with:
          repository: n3o-resourcespace

      - name: disk before
        run: df -h /

      # Stated rather than inherited: an arm64 build reaches production as an exec
      # format error at container start rather than as a failed build.
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.acr.outputs.builder }}
          context: .
          target: final
          file: Dockerfile.resourcespace
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.version-tag }} , ${{ steps.meta.outputs.latest-tag }}

      - name: disk after
        if: always()
        run: df -h /

  clip:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - id: acr
        name: acr login
        uses: n3oltd/actions/.github/actions/n3o-acr-login@main
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: fetch dockerfile and assets
        uses: n3oltd/actions/.github/actions/n3o-dockerfile-fetch@main
        with:
          dockerfile: resourcespace-clip
          path: Dockerfile.resourcespace-clip
          assets: |
            resourcespace-clip-service.py
            resourcespace-clip-requirements.txt
            resourcespace-clip-bake.py

      - id: meta
        name: prepare resourcespace-clip
        uses: n3oltd/actions/.github/actions/n3o-image-tags@main
        with:
          repository: n3o-resourcespace-clip

      - name: disk before
        run: df -h /

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.acr.outputs.builder }}
          context: .
          target: final
          file: Dockerfile.resourcespace-clip
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.version-tag }} , ${{ steps.meta.outputs.latest-tag }}

      - name: disk after
        if: always()
        run: df -h /
