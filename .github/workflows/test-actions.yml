name: Test actions

on:
  pull_request:
    paths:
      - '.github/actions/n3o-snapshot-push/**'
      - '.github/actions/n3o-source-sync-*/**'
      - '.github/actions/n3o-secret-scan/**'
      - '.github/tests/**'
      - '.github/workflows/test-actions.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/n3o-node-setup
        with:
          node-version: 24

      - id: gitleaks
        uses: ./.github/actions/n3o-secret-scan
        with:
          path: .github/tests
          scan: false

      - run: node --test .github/tests/*.test.mjs
        env:
          GITLEAKS: ${{ steps.gitleaks.outputs.gitleaks }}
