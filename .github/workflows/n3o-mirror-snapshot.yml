# Reusable workflow that mirrors one subtree of a monorepo to an external client repo as a
# snapshot, without the monorepo's history. A monorepo enables it with a thin per-client caller on
# push to main, path-filtered to that client's subtree.
#
# Each run appends one commit whose tree is the subtree's current tree and whose parent is the
# client branch's current head, then pushes it as a fast-forward over SSH with a per-client deploy
# key. The subtree is scanned for secrets first, and nothing is pushed if one is found.
name: n3o mirror snapshot

on:
  workflow_call:
    inputs:
      subtree-path:
        description: 'Monorepo path of the subtree to mirror (e.g. src/site-example)'
        required: true
        type: string
      target-repo-url:
        description: 'SSH URL of the client repo (e.g. ssh://git@github.com/example-client/website.git)'
        required: true
        type: string
      target-branch:
        description: 'Branch to update on the client repo'
        required: false
        default: main
        type: string
    secrets:
      ssh-key:
        description: 'SSH deploy key (private) with write access to the client repo'
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ${{ github.event.repository.private && 'n3o-github-runner' || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: n3o-mirror-snapshot-${{ inputs.target-repo-url }}-${{ inputs.target-branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: check subtree
        env:
          SUBTREE_PATH: ${{ inputs.subtree-path }}
        run: |
          if [ ! -d "$SUBTREE_PATH" ]; then
            echo "::error::subtree-path '$SUBTREE_PATH' does not exist"; exit 1
          fi

      - uses: n3oltd/actions/.github/actions/n3o-secret-scan@mirror-snapshot
        with:
          path: ${{ inputs.subtree-path }}

      - uses: n3oltd/actions/.github/actions/n3o-git-identity@main

      - id: ssh
        uses: n3oltd/actions/.github/actions/n3o-ssh-key@mirror-snapshot
        with:
          private-key: ${{ secrets.ssh-key }}

      - name: commit and push snapshot
        env:
          GIT_SSH_COMMAND: ${{ steps.ssh.outputs.git-ssh-command }}
          SUBTREE_PATH: ${{ inputs.subtree-path }}
          TARGET_URL: ${{ inputs.target-repo-url }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse "HEAD:$SUBTREE_PATH")
          parents=()

          # --exit-code returns 2 when the branch does not exist; anything else non-zero is a failure.
          status=0
          git ls-remote --exit-code --heads "$TARGET_URL" "$TARGET_BRANCH" > /dev/null || status=$?
          case "$status" in
            0)
              git fetch --no-tags --depth=1 "$TARGET_URL" "refs/heads/$TARGET_BRANCH"
              head=$(git rev-parse FETCH_HEAD)
              if [ "$(git rev-parse "$head^{tree}")" = "$tree" ]; then
                echo "$TARGET_BRANCH already matches $SUBTREE_PATH"; exit 0
              fi
              parents=(-p "$head")
              ;;
            2) echo "$TARGET_BRANCH does not exist yet; creating it" ;;
            *) exit "$status" ;;
          esac

          commit=$(git commit-tree "$tree" "${parents[@]}" -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA}")
          echo "Mirroring $SUBTREE_PATH ($commit) -> $TARGET_URL ($TARGET_BRANCH)"
          git push "$TARGET_URL" "$commit:refs/heads/$TARGET_BRANCH"
